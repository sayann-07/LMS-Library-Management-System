<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0C0A09" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A952" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#B87B28" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="sunbeam" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#F3C68F" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#B87B28" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="bookshelfPattern" width="120" height="80" patternUnits="userSpaceOnUse">
      <rect x="0" y="70" width="120" height="10" fill="#292524" />
      <!-- Books on shelf -->
      <rect x="6" y="15" width="14" height="55" rx="2" fill="#8C5914" />
      <rect x="23" y="10" width="18" height="60" rx="2" fill="#B87B28" />
      <rect x="44" y="20" width="12" height="50" rx="2" fill="#57534E" />
      <rect x="59" y="12" width="20" height="58" rx="2" fill="#A87023" />
      <rect x="82" y="18" width="16" height="52" rx="2" fill="#383431" />
      <rect x="101" y="8" width="14" height="62" rx="2" fill="#C59B27" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Architectural Grand Library Arch -->
  <path d="M 100 1000 L 100 350 Q 400 50 700 350 L 700 1000 Z" fill="#171513" stroke="#B87B28" stroke-width="2" stroke-opacity="0.3" />
  <path d="M 140 1000 L 140 370 Q 400 110 660 370 L 660 1000 Z" fill="#131210" stroke="#B87B28" stroke-width="1" stroke-opacity="0.2" />

  <!-- Shelves -->
  <rect x="150" y="280" width="500" height="580" fill="url(#bookshelfPattern)" opacity="0.6" />

  <!-- Ambient Sunbeam Light Fall -->
  <rect width="800" height="1000" fill="url(#sunbeam)" />

  <!-- Large Central Window Arch -->
  <path d="M 280 850 L 280 420 Q 400 250 520 420 L 520 850 Z" fill="#24201C" stroke="#E5A952" stroke-width="2" stroke-opacity="0.4" />
  <!-- Window mullions -->
  <line x1="400" y1="280" x2="400" y2="850" stroke="#E5A952" stroke-width="1.5" stroke-opacity="0.3" />
  <line x1="280" y1="520" x2="520" y2="520" stroke="#E5A952" stroke-width="1" stroke-opacity="0.3" />
  <line x1="280" y1="680" x2="520" y2="680" stroke="#E5A952" stroke-width="1" stroke-opacity="0.3" />

  <!-- Soft Vignette & Floor Lighting -->
  <circle cx="400" cy="850" r="240" fill="url(#goldGlow)" />
</svg>

